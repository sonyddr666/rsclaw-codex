name: Build Linux binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build rsclaw Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/rsclaw dist/rsclaw
          strip dist/rsclaw || true
          tar -C dist -czf rsclaw-linux-x86_64.tar.gz rsclaw
          sha256sum rsclaw-linux-x86_64.tar.gz > rsclaw-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsclaw-linux-x86_64
          path: |
            rsclaw-linux-x86_64.tar.gz
            rsclaw-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            rsclaw-linux-x86_64.tar.gz \
            rsclaw-linux-x86_64.tar.gz.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "No-Docker Linux x86_64 rsclaw binary."
